# Secret templates. Never commit real values: copy this file, fill it in, and
# `kubectl apply` it out-of-band (or seal it with Sealed Secrets / SOPS).

# Frontend (Next.js / Auth0 session)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: watch2play-frontend-secret
#   namespace: watch2play
# type: Opaque
# stringData:
#   AUTH0_SECRET: "your-actual-secret-here"
#   AUTH0_CLIENT_ID: "your-client-id"
#   AUTH0_CLIENT_SECRET: "your-client-secret"

# Backend (FastAPI), referenced by backend.yaml
# apiVersion: v1
# kind: Secret
# metadata:
#   name: watch2play-backend-secret
#   namespace: watch2play
# type: Opaque
# stringData:
#   AUTH0_DOMAIN: "auth.yourdomain.com"  # Your custom domain (or tenant domain if no custom domain)
#   AUTH0_MGMT_DOMAIN: "your-tenant.us.auth0.com"  # Tenant domain for Management API (required if using custom domain)
#   AUTH0_MGMT_CLIENT_ID: "your-m2m-client-id"
#   AUTH0_MGMT_CLIENT_SECRET: "your-m2m-client-secret"
#   # Stripe Configuration
#   STRIPE_SECRET_KEY: "sk_test_xxxxx"
#   STRIPE_WEBHOOK_SECRET: "whsec_xxxxx"
#   STRIPE_PRICE_ID_2GB: "price_xxxxx"
#   STRIPE_PRICE_ID_4GB: "price_xxxxx"
#   STRIPE_PRICE_ID_6GB: "price_xxxxx"
#   STRIPE_PRICE_ID_8GB: "price_xxxxx"
#   # Mailgun Configuration for Support Emails
#   MAILGUN_API_KEY: "key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#   MAILGUN_DOMAIN: "mg.yourdomain.com"
#   MAILGUN_FROM_EMAIL: "noreply@yourdomain.com"
#   SUPPORT_EMAIL: "support@yourdomain.com"

# Velocity proxy, referenced by velocity.yaml and backend.yaml.
# forwarding-secret is shared by Velocity and every Paper server; the backend
# copies it into each server-<user> namespace at provision time.
#   kubectl create secret generic velocity-secret -n watch2play \
#     --from-literal=forwarding-secret="$(openssl rand -hex 32)" \
#     --from-literal=rcon-password="$(openssl rand -hex 32)"
